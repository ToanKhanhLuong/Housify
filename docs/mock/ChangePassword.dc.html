<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đổi mật khẩu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/8c542f24d703b19ce315047abd610531">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="hf app">
  <div class="side"><dc-import name="Sidebar" role="{{ role }}" active="" hint-size="100%,900px"></dc-import></div>
  <main class="main">
    <dc-import name="Topbar" title="Đổi mật khẩu" role="{{ role }}" hint-size="100%,60px"></dc-import>
    <div class="page">
      <div class="paper" style="max-width: 560px; margin: 0">
        <div style="font-size: 18px; font-weight: 700">Đổi mật khẩu</div>
        <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}"><div class="alert a-ok">Đổi mật khẩu thành công.</div></sc-if>
        <sc-if value="{{ wrongOld }}" hint-placeholder-val="{{ false }}"><div class="alert a-err">Mật khẩu hiện tại không đúng.</div></sc-if>
        <div class="field"><label class="lb" for="op">Mật khẩu hiện tại <span class="req">*</span></label><input id="op" class="inp {{ opErrCls }}" type="password" value="{{ op }}" onChange="{{ onOp }}"><sc-if value="{{ opErr }}" hint-placeholder-val="{{ false }}"><span class="err">Vui lòng nhập mật khẩu hiện tại</span></sc-if></div>
        <div class="field"><label class="lb" for="np">Mật khẩu mới <span class="req">*</span></label><input id="np" class="inp {{ npErrCls }}" type="password" value="{{ np }}" onChange="{{ onNp }}"><span class="{{ npHintCls }}">{{ npMsg }}</span></div>
        <div class="field"><label class="lb" for="cp">Nhập lại mật khẩu mới <span class="req">*</span></label><input id="cp" class="inp {{ cpErrCls }}" type="password" value="{{ cp }}" onChange="{{ onCp }}"><sc-if value="{{ cpErr }}" hint-placeholder-val="{{ false }}"><span class="err">Mật khẩu nhập lại không khớp</span></sc-if></div>
        <div style="display: flex; gap: 8px"><button class="btn btn-p" onClick="{{ save }}">Đổi mật khẩu</button><button class="btn btn-s" onClick="{{ reset }}">Hủy</button></div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["admin","manager","customer"],"default":"admin"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { op: '', np: '', cp: '', tried: false, done: false, wrongOld: false };
  }
  renderVals() {
    const s = this.state;
    const fmt = s.np.length >= 6 && /[A-Za-z]/.test(s.np) && /\d/.test(s.np);
    const same = !!s.np && s.np === s.op;
    const t = s.tried;
    return {
      role: this.props.role || 'admin',
      op: s.op, np: s.np, cp: s.cp,
      onOp: (e) => this.setState({ op: e.target.value, wrongOld: false }), onNp: (e) => this.setState({ np: e.target.value }), onCp: (e) => this.setState({ cp: e.target.value }),
      opErr: t && !s.op, opErrCls: (t && !s.op) || s.wrongOld ? 'inp-err' : '',
      npErrCls: t && (!fmt || same) ? 'inp-err' : '', npHintCls: t && (!fmt || same) ? 'err' : 'hint',
      npMsg: t && same ? 'Mật khẩu mới phải khác mật khẩu hiện tại' : 'Ít nhất 6 ký tự, có cả chữ và số, khác mật khẩu hiện tại.',
      cpErr: t && s.np !== s.cp, cpErrCls: t && s.np !== s.cp ? 'inp-err' : '',
      done: s.done, wrongOld: s.wrongOld,
      save: () => {
        if (!s.op || !fmt || same || s.np !== s.cp) { this.setState({ tried: true, done: false }); return; }
        if (s.op.length < 6) { this.setState({ wrongOld: true, done: false }); return; }
        this.setState({ done: true, tried: false, op: '', np: '', cp: '' });
      },
      reset: () => this.setState({ op: '', np: '', cp: '', tried: false, done: false, wrongOld: false })
    };
  }
}
</script>
</body>
</html>
